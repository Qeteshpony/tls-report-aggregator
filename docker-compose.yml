services:
  tlsreport:
    build: ./tlsreport
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: mariadb:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql:/var/lib/mysql
      - ./db/tlsreport.sql:/docker-entrypoint-initdb.d/tlsreport.sql
    # sql port is only exposed for development. For normal operation we keep this internal
    # ports:
    #  - "3306:3306"

  # adminer is used for manually managing the database. This is only needed for development
  #adminer:
  #  image: adminer:latest
  #  restart: no
  #  depends_on:
  #    - db
  #  ports:
  #    - "8080:8080"

  grafana:
    build: ./grafana
    restart: unless-stopped
    env_file:
      - ./grafana/grafana.env
    depends_on:
      - db
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  mysql:
  grafana-storage: